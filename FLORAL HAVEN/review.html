      <h1>Flower Shop Review</h1>
    <div class="contai">    
        <h2>Leave a Review</h2>
        <form class="review-form">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <label for="review">Review:</label>
            <textarea id="review" name="review" required></textarea>

            <button type="submit">Submit Review</button>
        </form>

        <h2>Customer Reviews</h2>
        <div class="reviews">
            <div class="review">
                <div class="review-header">
                    <span class="reviewer">John</span>
                </div>
                <p>Beautiful flowers, excellent service!</p>
            </div>

            <div class="review">
                <div class="review-header">
                    <span class="reviewer">Martha</span>
                </div>
                <p>Highly recommend this shop.</p>
            </div>
            <div class="review">
                <div class="review-header">
                    <span class="reviewer">Ali</span>
                </div>
                <p> This website is a masterpiece for flower lovers.</p>
            </div>
        </div>
    </div>
